# application-test.properties para pruebas de integración
spring.application.name=msvc-ventas-test

# Base de datos H2 en memoria para tests (más rápido que MySQL)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.microservicios=DEBUG
logging.level.org.springframework.web=DEBUG

# Desactivar Eureka en tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Stripe (usar clave de test)
stripe.api.key=sk_test_XXXXXX

# Puerto aleatorio para evitar conflictos
server.port=0
