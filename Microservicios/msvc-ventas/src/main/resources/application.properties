# Puerto del microservicio
server.port=8083

# Nombre de la aplicacion
spring.application.name=msvc-ventas

# Configuracion de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ventas?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Eureka Client
# TEMPORALMENTE DESHABILITADO - Problema de compatibilidad con Spring Cloud 2024.0.1
# Ver: https://github.com/spring-cloud/spring-cloud-netflix/issues/4484
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Una vez resuelto, descomentar:
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#eureka.instance.instance-id=${spring.application.name}:${random.value}
#eureka.instance.prefer-ip-address=true

# Configuracion para los microservicios
app.msvc-inventario.url=http://localhost:8082
app.msvc-producto.url=http://localhost:8081

# Configuracion de Stripe
stripe.api.key=sk_test_51SlzSHHOhPZsHYIaQj5gbXAldSb8sB0jxt19oGZrgtSGmcd3cnkT1V7GchC5gYFk39TQArCcMJZtmXMQqi04IY7a003b4bKIIP
stripe.webhook.secret=pk_test_51SlzSHHOhPZsHYIadvvcjOarXE6LZkYgoxe14OHbyl9dZXJok6YjEkD5Z2K23z2xtJdILhupdxHsXksydO2XDb1t004cAH27n7

# Configuracion de Facturas PDF
factura.directorio=facturas

# Configuracion de Circuit Breaker para Feign
feign.circuitbreaker.enabled=true

# Configuracion de Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.writer-with-default-pretty-printer=true

# Aumentar timeouts y pool de conexiones
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
server.tomcat.max-connections=200
server.tomcat.connection-timeout=30000

# Logs menos verbosos
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# Configuracion de Camunda BPM
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.firstName=Admin
camunda.bpm.admin-user.lastName=User
camunda.bpm.admin-user.email=admin@siachos.com
camunda.bpm.filter.create=All tasks
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.deployment-resource-pattern=classpath*:**/*.bpmn
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.id-generator=strong
camunda.bpm.job-execution.enabled=true
camunda.bpm.job-execution.deployment-aware=true