# Configuracion de la aplicacion
spring.application.name=login
server.port=8084

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuracion de Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# Configuracion de Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Aumentar timeouts y pool de conexiones
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
server.tomcat.max-connections=200
server.tomcat.connection-timeout=30000

# Logs menos verbosos
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# Clave secreta fija para JWT (permite que los tokens sobrevivan reinicios del servidor)
jwt.secret=TiendaVirtualFeriaDigital2024SecretKeyForJWTSigningMustBe256BitsLong!!

# Google OAuth (login con Google) - definir GOOGLE_CLIENT_ID como variable de entorno
# Debe ser el mismo Client ID configurado en el frontend (NEXT_PUBLIC_GOOGLE_CLIENT_ID)
google.client-id=${GOOGLE_CLIENT_ID:}

# Envio de correos (recuperacion de contrasena). En dev cae a un sandbox de Mailtrap;
# en produccion definir MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD reales.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:changeme}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${MAIL_FROM:noreply@ecommerce-sigchos.com}
app.mail.from-name=${MAIL_FROM_NAME:Sigchos E-commerce}