# Configuracion de la aplicacion
spring.application.name=login
server.port=8084

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuracion de Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# Configuracion de Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Aumentar timeouts y pool de conexiones
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
server.tomcat.max-connections=200
server.tomcat.connection-timeout=30000

# Logs menos verbosos
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# Clave secreta fija para JWT (permite que los tokens sobrevivan reinicios del servidor)
jwt.secret=TiendaVirtualFeriaDigital2024SecretKeyForJWTSigningMustBe256BitsLong!!