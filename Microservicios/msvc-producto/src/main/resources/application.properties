spring.application.name=msvc-producto

# Puerto del servicio (distinto al del servicio de autenticacion)
server.port=8081

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/productos?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuracion de Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# URL del microservicio de inventario
app.msvc-inventario.url=http://localhost:8082

# Estamos habilitando la integracion de Feign con el Circuit Breaker
feign.circuitbreaker.enabled=true

# Configuracion de Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Configuracion del pool de conexiones Hikari (aumentado para JMeter)
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool-1

# Aumentar timeouts y pool de conexiones
server.tomcat.max-connections=200
server.tomcat.connection-timeout=30000

# Logs menos verbosos
logging.level.org.springframework.web=WARN
logging.level.root=WARN